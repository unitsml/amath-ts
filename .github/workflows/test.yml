name: PARG runtime conformance
on:
  pull_request:
  push:
    branches: [main, migration/math-portability-20261110]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:artifacts
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
  generated-models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lutaml/lutaml-ts
          ref: 1242c7b6314dcadc42e3453e85c9f2fc879cd7ef
          path: .build/lutaml-ts-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/generate-models.mjs .build/lutaml-ts-source
      - run: git diff --exit-code -- src/generated src/upstream model/codegen-provenance.json
