name: PARG runtime conformance
on:
  pull_request:
  push:
    branches: [main, migration/math-portability-20261110]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:artifacts
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
  generated-models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lutaml/lutaml-ts
          ref: 1242c7b6314dcadc42e3453e85c9f2fc879cd7ef
          path: .build/lutaml-ts-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/generate-models.mjs .build/lutaml-ts-source
      - run: git diff --exit-code -- src/generated src/upstream model/codegen-provenance.json
  # AsciiMath generation 5 (the generation Ruby amath replays): every live
  # raw-tree and typed-model row, replayed through the packed tarball
  # installed into a clean consumer. Every row must match.
  asciimath-generation-5:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TESTSUITE_COMMIT: 674126a07fa1cf89c24bc50fadb305299e1d1b18
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check TESTSUITE_COMMIT matches the pin
        run: |
          pinned=$(node -p 'require("./scripts/corpus-pin.json").revision')
          test "$pinned" = "$TESTSUITE_COMMIT" || { echo "TESTSUITE_COMMIT=$TESTSUITE_COMMIT but the pin has $pinned"; exit 1; }
      - name: Pack and install the tarball into a clean consumer
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          mkdir consumer
          cd consumer
          echo '{"name":"consumer","private":true}' > package.json
          npm install --no-audit --no-fund ../plurimath-amath-ts-*.tgz
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: ${{ env.TESTSUITE_COMMIT }}
          path: .corpus5
          persist-credentials: false
      - name: Replay generation 5 through the packed package
        env:
          AMATH_TS_DIST: ${{ runner.temp }}/consumer/node_modules/@plurimath/amath-ts/dist
        run: >
          npm run test:corpus -- .corpus5
          --report "$RUNNER_TEMP/replay-5.json" --executed "$RUNNER_TEMP/executed-5.txt"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: asciimath-generation-5-${{ matrix.os }}
          path: ${{ runner.temp }}/replay-5.json
          if-no-files-found: ignore
